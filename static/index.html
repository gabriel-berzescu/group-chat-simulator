<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Chat Simulator</title>
  <style>
    :root {
      --bg: #eef1f6;
      --card: #ffffff;
      --sidebar: #f6f8fc;
      --border: #e3e7ee;
      --text: #1c2333;
      --text-muted: #7a8299;
      --bubble-theirs: #f1f3f8;
      --accent: #4f6ef7;
      --accent-dark: #3d5af1;
      --bubble-mine-text: #ffffff;
      --hover: rgba(79, 110, 247, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c;
        --card: #1a1f2a;
        --sidebar: #161b24;
        --border: #2a3140;
        --text: #e8ebf2;
        --text-muted: #8b93a7;
        --bubble-theirs: #252c3a;
        --hover: rgba(79, 110, 247, 0.16);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      height: 100dvh;
    }

    .app {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr) 230px;
      width: 100%;
      max-width: 1320px;
      height: 100%;
      background: var(--card);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* ---------- sidebar-uri ---------- */

    .sidebar {
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar--left {
      border-right: 1px solid var(--border);
    }

    .sidebar--right {
      border-left: 1px solid var(--border);
    }

    .sidebar-header {
      padding: 16px 16px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header h2 {
      margin: 0;
      flex: 1;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    #new-conversation {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border: none;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
    }

    #new-conversation:hover {
      filter: brightness(1.08);
    }

    .sidebar-list {
      list-style: none;
      margin: 0;
      padding: 0 10px 16px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* conversații */

    .conversation-item {
      position: relative;
      display: flex;
      align-items: center;
      border-radius: 10px;
    }

    .conversation-item:hover,
    .conversation-item.menu-open {
      background: var(--hover);
    }

    .conversation-item.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
    }

    .conversation-open {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 4px 9px 10px;
      border: none;
      border-radius: 10px;
      background: none;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .kebab {
      flex-shrink: 0;
      width: 24px;
      height: 28px;
      margin-right: 4px;
      border: none;
      border-radius: 7px;
      background: none;
      color: inherit;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
    }

    .conversation-item:hover .kebab,
    .conversation-item.menu-open .kebab,
    .conversation-item:focus-within .kebab {
      opacity: 0.75;
    }

    .kebab:hover {
      opacity: 1;
      background: rgba(127, 127, 127, 0.22);
    }

    /* meniul kebab */

    /* fixed, nu absolute: lista are overflow-y auto și ar tăia meniul
       la conversațiile de jos. Poziția o calculează JS-ul la deschidere. */
    .menu {
      display: none;
      position: fixed;
      z-index: 8;
      width: 176px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--card);
      color: var(--text);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .conversation-item.menu-open .menu {
      display: block;
    }

    .menu button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      background: none;
      color: inherit;
      font: inherit;
      font-size: 13.5px;
      text-align: left;
      cursor: pointer;
    }

    .menu button:hover {
      background: var(--hover);
    }

    .menu button.danger {
      color: #d6455f;
    }

    .menu button.danger:hover {
      background: rgba(214, 69, 95, 0.12);
    }

    .menu-confirm {
      display: none;
    }

    .menu-confirm p {
      margin: 4px 8px 8px;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .conversation-item.confirming .menu-actions {
      display: none;
    }

    .conversation-item.confirming .menu-confirm {
      display: block;
    }

    .rename-input {
      flex: 1;
      min-width: 0;
      padding: 4px 8px;
      border: 1px solid var(--accent);
      border-radius: 7px;
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 13.5px;
      outline: none;
    }

    .conversation-item .icon {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 9px;
      background: var(--bubble-theirs);
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .conversation-item.active .icon {
      background: rgba(255, 255, 255, 0.22);
    }

    .conversation-item .label {
      flex: 1;
      min-width: 0;
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-item .count {
      font-size: 11.5px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .conversation-item.active .count {
      color: rgba(255, 255, 255, 0.8);
    }

    /* personaje */

    .persona-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 10px;
    }

    .persona-item:hover {
      background: var(--hover);
    }

    .persona-item .avatar {
      width: 30px;
      height: 30px;
    }

    .persona-item .name {
      font-size: 13px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .sidebar-list .placeholder {
      padding: 6px 10px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ---------- chat ---------- */

    .chat {
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      background: var(--card);
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      margin: 0;
    }

    header .header-text {
      flex: 1;
      min-width: 0;
    }

    header .subtitle {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .drawer-toggle {
      display: none;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }

    #backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 5;
    }

    #messages {
      list-style: none;
      margin: 0;
      padding: 20px 16px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #messages .empty {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    #messages .empty .big {
      font-size: 34px;
      display: block;
      margin-bottom: 6px;
    }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 82%;
    }

    .message.mine {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bubble-theirs);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .bubble {
      padding: 8px 12px;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      background: var(--bubble-theirs);
      font-size: 14.5px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.mine .bubble {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: var(--bubble-mine-text);
      border-radius: 16px;
      border-bottom-right-radius: 4px;
    }

    .bubble .md {
      white-space: normal;
    }

    .md p,
    .md ul,
    .md ol,
    .md pre {
      margin: 0 0 8px;
    }

    .md > :last-child {
      margin-bottom: 0;
    }

    .md ul,
    .md ol {
      padding-left: 20px;
    }

    .md li {
      margin: 3px 0;
    }

    .md .heading {
      font-weight: 700;
    }

    .md hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 10px 0;
    }

    .md code {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 13px;
      background: rgba(127, 127, 127, 0.18);
      padding: 1px 5px;
      border-radius: 5px;
    }

    .md pre {
      background: rgba(127, 127, 127, 0.15);
      padding: 10px 12px;
      border-radius: 10px;
      overflow-x: auto;
    }

    .md pre code {
      background: none;
      padding: 0;
      font-size: 12.5px;
    }

    .bubble .author {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 2px;
      color: var(--accent);
    }

    .bubble .time {
      display: inline-block;
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 8px;
      float: right;
      margin-top: 6px;
    }

    .message.mine .time {
      color: rgba(255, 255, 255, 0.75);
    }

    .typing .bubble {
      display: flex;
      gap: 4px;
      padding: 12px 14px;
    }

    .typing .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: blink 1.2s infinite both;
    }

    .typing .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }

    #chat-form {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
    }

    #chat-input {
      flex: 1;
      min-width: 0;
      padding: 11px 16px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14.5px;
      outline: none;
    }

    #chat-input:focus {
      border-color: var(--accent);
    }

    #chat-form button {
      padding: 0 20px;
      border: none;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }

    #chat-form button:hover {
      filter: brightness(1.08);
    }

    #chat-form button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    /* ---------- ecrane înguste: sidebar-urile devin sertare ---------- */

    @media (max-width: 1080px) {
      .app {
        grid-template-columns: 210px minmax(0, 1fr) 200px;
      }
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: minmax(0, 1fr);
      }

      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 260px;
        z-index: 6;
        transition: transform 0.2s ease;
      }

      .sidebar--left {
        left: 0;
        transform: translateX(-100%);
      }

      .sidebar--right {
        right: 0;
        transform: translateX(100%);
      }

      .sidebar.open {
        transform: none;
      }

      .drawer-toggle {
        display: block;
      }

      #backdrop.open {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar sidebar--left" id="conversations-sidebar">
      <div class="sidebar-header">
        <h2>Conversații</h2>
        <button id="new-conversation" type="button" title="Conversație nouă">+</button>
      </div>
      <ul class="sidebar-list" id="conversation-list"></ul>
    </aside>

    <div class="chat">
      <header>
        <button class="drawer-toggle" id="toggle-conversations" type="button" title="Conversații">☰</button>
        <div class="logo">💬</div>
        <div class="header-text">
          <h1>Group Chat Simulator</h1>
          <div class="subtitle" id="chat-subtitle">Se încarcă…</div>
        </div>
        <button class="drawer-toggle" id="toggle-personas" type="button" title="Personaje">👥</button>
      </header>
      <ul id="messages"></ul>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Scrie un mesaj..." autocomplete="off">
        <button type="submit">Trimite</button>
      </form>
    </div>

    <aside class="sidebar sidebar--right" id="personas-sidebar">
      <div class="sidebar-header">
        <h2>Personaje</h2>
      </div>
      <ul class="sidebar-list" id="persona-list">
        <li class="placeholder">Se încarcă…</li>
      </ul>
    </aside>
  </div>
  <div id="backdrop"></div>
  <script src="app.js"></script>
</body>
</html>
