<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Chat Simulator</title>
  <style>
    :root {
      --bg: #eef1f6;
      --card: #ffffff;
      --border: #e3e7ee;
      --text: #1c2333;
      --text-muted: #7a8299;
      --bubble-theirs: #f1f3f8;
      --accent: #4f6ef7;
      --accent-dark: #3d5af1;
      --bubble-mine-text: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c;
        --card: #1a1f2a;
        --border: #2a3140;
        --text: #e8ebf2;
        --text-muted: #8b93a7;
        --bubble-theirs: #252c3a;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      height: 100dvh;
    }

    .chat {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 680px;
      height: 100%;
      background: var(--card);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    header h1 {
      font-size: 16px;
      margin: 0;
    }

    header .subtitle {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    #messages {
      list-style: none;
      margin: 0;
      padding: 20px 16px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #messages .empty {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    #messages .empty .big {
      font-size: 34px;
      display: block;
      margin-bottom: 6px;
    }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 82%;
    }

    .message.mine {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bubble-theirs);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .bubble {
      padding: 8px 12px;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      background: var(--bubble-theirs);
      font-size: 14.5px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.mine .bubble {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: var(--bubble-mine-text);
      border-radius: 16px;
      border-bottom-right-radius: 4px;
    }

    .bubble .md {
      white-space: normal;
    }

    .md p,
    .md ul,
    .md ol,
    .md pre {
      margin: 0 0 8px;
    }

    .md > :last-child {
      margin-bottom: 0;
    }

    .md ul,
    .md ol {
      padding-left: 20px;
    }

    .md li {
      margin: 3px 0;
    }

    .md .heading {
      font-weight: 700;
    }

    .md hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 10px 0;
    }

    .md code {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 13px;
      background: rgba(127, 127, 127, 0.18);
      padding: 1px 5px;
      border-radius: 5px;
    }

    .md pre {
      background: rgba(127, 127, 127, 0.15);
      padding: 10px 12px;
      border-radius: 10px;
      overflow-x: auto;
    }

    .md pre code {
      background: none;
      padding: 0;
      font-size: 12.5px;
    }

    .bubble .author {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 2px;
      color: var(--accent);
    }

    .bubble .time {
      display: inline-block;
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 8px;
      float: right;
      margin-top: 6px;
    }

    .message.mine .time {
      color: rgba(255, 255, 255, 0.75);
    }

    .typing .bubble {
      display: flex;
      gap: 4px;
      padding: 12px 14px;
    }

    .typing .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: blink 1.2s infinite both;
    }

    .typing .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }

    #chat-form {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
    }

    #chat-input {
      flex: 1;
      padding: 11px 16px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14.5px;
      outline: none;
    }

    #chat-input:focus {
      border-color: var(--accent);
    }

    #chat-form button {
      padding: 0 20px;
      border: none;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }

    #chat-form button:hover {
      filter: brightness(1.08);
    }

    #chat-form button:disabled {
      opacity: 0.6;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="chat">
    <header>
      <div class="logo">💬</div>
      <div>
        <h1>Group Chat Simulator</h1>
        <div class="subtitle" id="roster">Se încarcă personajele…</div>
      </div>
    </header>
    <ul id="messages"></ul>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Scrie un mesaj..." autocomplete="off">
      <button type="submit">Trimite</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
